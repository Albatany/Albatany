<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" role="img" aria-labelledby="title desc">
<title id="title">whoami: Aziz Albatany</title>
<desc id="desc">Aziz Albatany, aka AceBreaker or Qiho. Informatics student at Universitas Jambi and Minecraft Developer at Lucky Network SEA. Into game dev, design, servers and ethical hacking. Games: Memory Loop, Programming Pathways. Server: Ranked Bedwars plugins, C-REDRO bot. Design: pixel art, HMIF Unja publications. Security: ZT-HAC, VaultKeep, SeeNoEvil, WebEagle. Band: Crank, post-hardcore and emo revival. Speaks Indonesian and English.</desc>
<style>
  text { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; fill: #ececec; }
  .ui { font-family: -apple-system, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #a1a1a6; }
  .p { fill: #8e8e93; }
  .k { fill: #64d2ff; }
  .a { fill: #ff9f0a; }
  .d { fill: #8e8e93; }
  .l { animation: reveal 20s ease infinite backwards; }
  .cur { fill: #ff9f0a; animation: blink 1.1s steps(1) infinite; }
  @keyframes reveal {
    0% { opacity: 0; transform: translateY(3px); }
    3% { opacity: 1; transform: none; }
    95% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes blink { 50% { fill-opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
