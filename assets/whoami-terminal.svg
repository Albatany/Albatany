<svg viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami">
<defs>
  <style>
    @keyframes breathe {
      0%,100% { opacity:.45; stroke-width:1.4; }
      50% { opacity:1; stroke-width:2.2; }
    }
    @keyframes blink {
      0%,49% { opacity:1; }
      50%,100% { opacity:0; }
    }
    @keyframes flicker {
      0%,19%,21%,23%,52%,54%,100% { opacity:1; }
      20%,22%,53% { opacity:.5; }
    }
    @keyframes sweep {
      from { transform: translateX(-120px); }
      to   { transform: translateX(800px); }
    }
    .border-glow { animation: breathe 3.4s ease-in-out infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .decrypt { animation: flicker 6.5s linear infinite; }
    .beam { animation: sweep 5s linear infinite; }
  </style>
  <radialGradient id="vg" cx="50%" cy="35%" r="80%">
    <stop offset="60%" stop-color="#0d0208" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity=".8"/>
  </radialGradient>
  <pattern id="scan2" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000000" opacity=".3"/>
  </pattern>
  <linearGradient id="beamGrad" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0%" stop-color="#39ff14" stop-opacity="0"/>
    <stop offset="50%" stop-color="#39ff14" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="cardClip">
    <rect x="3" y="3" width="674" height="384" rx="14"/>
  </clipPath>
</defs>

<rect x="3" y="3" width="674" height="384" rx="14" fill="#0d0208"/>

<g clip-path="url(#cardClip)">
  <rect width="680" height="390" fill="url(#vg)"/>
  <rect width="680" height="390" fill="url(#scan2)"/>
  <rect class="beam" y="0" width="120" height="390" fill="url(#beamGrad)"/>

  <!-- title bar -->
  <circle cx="24" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="24" r="6" fill="#27c93f"/>
  <text x="340.0" y="29" text-anchor="middle" font-family="ui-monospace, 'Courier New', monospace" font-size="13" fill="#39ff14" opacity=".55">root@acebreaker:~</text>
  <line x1="0" y1="46" x2="680" y2="46" stroke="#39ff14" stroke-opacity=".25"/>

  <text class="decrypt" x="34" y="72" font-family="ui-monospace, 'Courier New', monospace" font-size="14" fill="#8affa4">&gt; decrypting identity... <tspan fill="#39ff14">OK</tspan></text>
  <text x="34" y="94" font-family="ui-monospace, 'Courier New', monospace" font-size="14" fill="#c9ffd6">$ cat profile.log</text>

  <text x="34" y="132" font-family="ui-monospace, 'Courier New', monospace" font-size="14" xml:space="preserve"><tspan x="34" dy="0"><tspan fill="#39ff14" opacity=".55">name: </tspan><tspan fill="#c9ffd6">Aziz Albatany</tspan></tspan><tspan x="34" dy="26"><tspan fill="#39ff14" opacity=".55">alias: </tspan><tspan fill="#c9ffd6">AceBreaker "Ace", Qiho</tspan></tspan><tspan x="34" dy="26"><tspan fill="#39ff14" opacity=".55">role: </tspan><tspan fill="#c9ffd6">Game Programming Student</tspan></tspan><tspan x="34" dy="26"><tspan fill="#39ff14" opacity=".55">stacks: </tspan><tspan fill="#c9ffd6">Unity/C# Development, JS, Node.js, Discord.js</tspan></tspan><tspan x="34" dy="26"><tspan fill="#39ff14" opacity=".55">crafts: </tspan><tspan fill="#c9ffd6">gameplay systems, pixel art, Discord bots</tspan></tspan><tspan x="34" dy="26"><tspan fill="#39ff14" opacity=".55">band: </tspan><tspan fill="#c9ffd6">Crank, post-hardcore / emo revival</tspan></tspan><tspan x="34" dy="26"><tspan fill="#39ff14" opacity=".55">focus: </tspan><tspan fill="#c9ffd6">narrative systems and gameplay architecture</tspan></tspan><tspan x="34" dy="26"><tspan fill="#39ff14" opacity=".55">locale: </tspan><tspan fill="#c9ffd6">Indonesian, English</tspan></tspan></text>

  <text x="34" y="348" font-family="ui-monospace, 'Courier New', monospace" font-size="14" fill="#c9ffd6">root@acebreaker:~$ <tspan class="cursor" fill="#39ff14">&#9608;</tspan></text>
</g>

<rect x="1.5" y="1.5" width="677" height="387" rx="14" fill="none" stroke="#39ff14" stroke-width="1.4"/>
<rect class="border-glow" x="1.5" y="1.5" width="677" height="387" rx="14" fill="none" stroke="#39ff14"/>
</svg>
